[package]
name = "xmip-core-transport-serial"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-serial"
description = "Serial transport: bytes on a serial port, delimited or fixed-length frames, one frame is one Stream. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`), the same on every operating system.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

# The port itself, the technology's code, so behind the default feature; a
# system that is neither Windows nor Unix has no port and builds the framing
# alone.
#
# On Windows, the system's own calls (`src/system.rs`): the port opened for
# overlapped I/O, so a receive waits for its first byte (`WaitCommEvent`)
# while another Location writes, which `serialport`'s port, opened for
# synchronous I/O, cannot: Windows runs one call at a time on such a handle,
# so a wait on it held every write (ADR-0064, amendment 2026-11-15). Each
# operation on it is waited for by the estate's one overlapped wait, net's
# (`net::system::overlapped`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Devices_Communication", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", optional = true }

# On Unix, `serialport`'s port, waited on with `poll` beside the reads and
# writes (`transport::socket::ready`, over the descriptor `src/system.rs`
# lends). Without its default features: they are libudev, for listing USB
# ports, which nothing here does, and on Linux they made the crate need the
# libudev development headers to build at all — found on the AlmaLinux guest
# on 2026-09-24, where serial had never been built before.
[target.'cfg(unix)'.dependencies]
serialport = { version = "4", optional = true, default-features = false }

[features]
# The code, the port included, and its declaration: the transport guide's
# "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:serialport", "dep:windows-sys", "dep:net"]
# The declaration alone. The same on every operating system, one with no
# serial port included.
declaration = []
# A device on a bench (`bench`): what a test of a line's port opens it
# through, with no device and no sleep. A crate asks for it from its
# dev-dependencies, so it reaches tests and never a production build. The
# technology's code, so the default with it.
test-support = ["default"]

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }

[lints.rust]
# deny, not forbid: the port's calls to the system — Windows', and the
# descriptor lent to `poll` on Unix — cross a C interface in one file,
# `src/system.rs`, which lowers this at its top (ADR-0050, amendment
# 2026-09-25; `test/Unsafe.Test.ps1` lists it). Every other file of the crate
# writes no unsafe code.
unsafe_code = "deny"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
